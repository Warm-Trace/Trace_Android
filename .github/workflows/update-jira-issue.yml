name: Update Jira Issue on GitHub Issue Edited

on:
  issues:
    types:
      - edited   # 이슈 수정 시

jobs:
  update-jira-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue title includes Jira key
        id: check-jira-key
        run: |
          echo "ISSUE_TITLE='${{ github.event.issue.title }}'"
          # 정규식으로 Jira 이슈 키(WT-1234) 추출 (프로젝트 키에 맞게 수정)
          if [[ "${{ github.event.issue.title }}" =~ ([A-Z]+-[0-9]+) ]]; then
            echo "JIRA_ISSUE_KEY=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "No Jira issue key found in title. Exit."
            exit 0
          fi

      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

      - name: Convert markdown to Jira Syntax
        uses: peter-evans/jira2md@v1
        id: md2jira
        with:
          input-text: |
            ### Github Issue Link
            - ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}

      - name: Update Jira Issue Description
        uses: atlassian/gajira-update@v3
        with:
          issue: ${{ env.JIRA_ISSUE_KEY }}
          fields: |
            {
              "description": "${{ steps.md2jira.outputs.output-text }}"
            }
